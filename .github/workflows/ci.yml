name: Go validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run live provider integration tests
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go 1.27.3 offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Remove previous generated reports
        run: |
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
      - name: Tests, race detector and coverage report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1 # v1.1.2
        with:
          version: v1.1.2
          packages: ./...
          race: "true"
          cover_mode: atomic
          test_args: -count=1
          commit: "false"
      - name: Static checks
        run: go vet ./...
      - name: Go Report Card
        if: "!cancelled()"
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970 # v1.1.3
        with:
          version: v1.1.3
          report: "true"
          threshold: "0"
          commit: "false"
      - name: Upload stable reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-quality-stable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-quality-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn

  publish-reports:
    name: Publish quality reports
    needs: [test, cross-build]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: go-quality-writeback-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-quality-stable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-quality-stable
      - name: Commit reports for the unchanged default branch
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT_DIR: ${{ runner.temp }}/go-quality-stable
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          current=$(git rev-parse FETCH_HEAD)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "Default branch changed; reports remain available as artifacts." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -C "$DEFAULT_BRANCH" "$current"
          test ! -L .github
          # Uploading files with the common .github/ root stores them flat.
          for file in go-test-report.md go-test-report.json coverage.svg goreportcard.svg goreportcard-report.md; do
            test -f "$REPORT_DIR/$file"
            test ! -L "$REPORT_DIR/$file"
            test ! -L ".github/$file"
            cp "$REPORT_DIR/$file" ".github/$file"
          done
          git add -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Go quality reports [skip ci]"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

  cross-build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-compile library
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build .

  integration:
    name: Live provider integration tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run live provider checks
        run: go test -tags integration -run 'Integration$' -count=1 .
